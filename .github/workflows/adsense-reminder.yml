name: AdSense Registration Reminder

on:
  schedule:
    - cron: '0 0 1 7 *' # 2026년 7월 1일 KST 09:00
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send AdSense reminder email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[AI전환연구소] AdSense 신청 시기입니다!"
          to: ${{ secrets.GMAIL_USER }}
          from: AI전환연구소 <${{ secrets.GMAIL_USER }}>
          body: |
            안녕하세요! AI전환연구소 블로그의 AdSense 신청 시기가 되었습니다.

            현재 상태:
            - 도메인 나이: 약 5주
            - 예상 글 수: 70~80개
            - 도메인: https://aitrans-lab.com

            신청 방법:
            1. https://www.google.com/adsense/start 접속
            2. 사이트 URL: aitrans-lab.com 입력
            3. 제출 후 1~7일 대기

            승인되면 Claude Code에서 환경변수 설정을 도와드립니다.
            NEXT_PUBLIC_ADSENSE_CLIENT 값만 추가하면 자동으로 광고가 붙습니다.
