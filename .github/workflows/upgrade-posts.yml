name: Upgrade Existing Posts

on:
  schedule:
    - cron: '0 2 * * 1-5' # UTC 02:00 = KST 11:00, Mon-Fri
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of posts to upgrade'
        default: '5'

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Upgrade posts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
        run: npx tsx scripts/upgrade-posts.ts ${{ github.event.inputs.batch_size || '5' }}
